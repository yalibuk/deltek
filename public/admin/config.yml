# Deltek içerik paneli — Sveltia CMS
# Yerelde "npm run cms" ile çalışır (local_backend); yayında GitHub'a commit atar.

backend:
  name: github
  repo: KULLANICI-ADI/deltek-site   # ← yayına alırken GitHub kullanıcı/depo adınız
  branch: main

# Bilgisayarda çalışırken panel doğrudan yerel dosyaları düzenler.
local_backend: true

site_url: https://www.deltek.com.tr
display_url: https://www.deltek.com.tr

media_folder: public/images/uploads
public_folder: /images/uploads

# İki dilli içerik: her yazı için tr/ ve en/ altında birer dosya.
# Slug (dosya adı) iki dilde AYNI kalır — URL yapısı buna bağlı.
i18n:
  structure: multiple_folders
  locales: [tr, en]
  default_locale: tr

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: blog
    label: Blog
    label_singular: Yazı
    folder: src/content/blog
    create: true
    i18n: true
    identifier_field: baslik
    # DİKKAT: Bu slug canlı sitedeki URL'dir. Mevcut bir yazıyı taşırken
    # deltek.com.tr'deki slug'ın AYNISI girilmeli (bkz. CLAUDE.md).
    slug: "{{slug}}"
    summary: "{{baslik}}"
    sortable_fields: [tarih, baslik]
    fields:
      - { name: baslik, label: Başlık, widget: string, i18n: true }
      - { name: ozet,   label: Kısa özet (liste ve önizlemede görünür), widget: text, required: false, i18n: true }
      - { name: tarih,  label: Tarih, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, required: false, i18n: duplicate }
      - { name: kapak,  label: Kapak görseli, widget: image, required: false, i18n: duplicate }
      - { name: video,  label: "YouTube video linki (isteğe bağlı)", widget: string, required: false, i18n: duplicate }
      - name: galeri
        label: Foto galerisi
        widget: list
        required: false
        i18n: duplicate
        label_singular: Fotoğraf
        fields:
          - { name: foto, label: Fotoğraf, widget: image }
      - { name: body, label: Yazı içeriği, widget: markdown, required: false, i18n: true }

  - name: sayfalar
    label: Sayfalar
    label_singular: Sayfa
    folder: src/content/sayfalar
    create: true
    i18n: true
    identifier_field: baslik
    # DİKKAT: Bu slug canlı sitedeki URL'dir. Mevcut bir sayfayı taşırken
    # deltek.com.tr'deki slug'ın AYNISI girilmeli (bkz. CLAUDE.md).
    # Sayfalar ve blog yazıları aynı kök adres alanını paylaşır — çakışma
    # olursa site derlenmez.
    slug: "{{slug}}"
    summary: "{{baslik}}"
    sortable_fields: [menuSira, baslik]
    fields:
      - { name: baslik, label: Başlık, widget: string, i18n: true }
      - { name: ozet, label: Kısa açıklama (arama sonuçlarında görünür), widget: text, required: false, i18n: true }
      - { name: menuSira, label: "Menü sırası (boş bırakılırsa menüde görünmez)", widget: number, required: false, value_type: int, i18n: duplicate }
      - { name: menuAd, label: "Menüde görünecek ad (boşsa başlık kullanılır)", widget: string, required: false, i18n: true }
      - { name: kapak, label: Kapak görseli, widget: image, required: false, i18n: duplicate }
      - name: duzen
        label: "İçerik düzeni"
        widget: select
        required: false
        i18n: duplicate
        options:
          - { label: "Normal (makale akışı)", value: "" }
          - { label: "Logo ızgarası (referans logoları yan yana)", value: "logo-izgara" }
          - { label: "Ürün / teknoloji şablonu", value: "urun" }
      - { name: body, label: Sayfa içeriği, widget: markdown, required: false, i18n: true }

      # ── Aşağıdakiler yalnızca "Ürün / teknoloji şablonu" seçiliyken kullanılır ──
      - { name: banner, label: "Üst banner görseli", widget: image, required: false, i18n: duplicate }
      - name: bloklar
        label: "Görsel + metin blokları"
        label_singular: Blok
        widget: list
        required: false
        i18n: true
        collapsed: false
        summary: "{{fields.baslik}}"
        fields:
          - { name: baslik, label: Başlık, widget: string, required: false }
          - { name: metin, label: Metin, widget: text, required: false }
          - { name: gorsel, label: Görsel, widget: image, required: false }
          - { name: ters, label: "Görsel sağda dursun", widget: boolean, required: false, default: false }
          - name: boyut
            label: "Görsel boyutu (boşsa tam genişlik)"
            widget: select
            required: false
            options: ["", ceyrek, otuz, kirk, elli, yari, kucuk]
      - name: tablolar
        label: "Teknik veri tabloları"
        label_singular: Tablo
        widget: list
        required: false
        i18n: true
        summary: "{{fields.baslik}}"
        fields:
          - { name: baslik, label: Tablo başlığı, widget: string, required: false }
          - { name: aciklama, label: Açıklama, widget: text, required: false }
          - { name: basliklar, label: "Sütun başlıkları", widget: list, required: false, field: { name: ad, label: Başlık, widget: string } }
          - name: satirlar
            label: Satırlar
            label_singular: Satır
            widget: list
            required: false
            fields:
              - { name: hucreler, label: Hücreler, widget: list, field: { name: deger, label: Değer, widget: string } }
      - name: galeri
        label: "Foto galerisi"
        label_singular: Fotoğraf
        widget: list
        required: false
        i18n: duplicate
        fields:
          - { name: foto, label: Fotoğraf, widget: image }
          - { name: alt, label: "Alternatif metin", widget: string, required: false }
