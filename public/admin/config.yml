# Deltek içerik paneli — Sveltia CMS
# Yerelde "npm run cms" ile çalışır (local_backend); yayında GitHub'a commit atar.

backend:
  name: github
  repo: KULLANICI-ADI/deltek-site   # ← yayına alırken GitHub kullanıcı/depo adınız
  branch: main

# Bilgisayarda çalışırken panel doğrudan yerel dosyaları düzenler.
local_backend: true

site_url: https://www.deltek.com.tr
display_url: https://www.deltek.com.tr

media_folder: public/images/uploads
public_folder: /images/uploads

# İki dilli içerik: her yazı için tr/ ve en/ altında birer dosya.
# Slug (dosya adı) iki dilde AYNI kalır — URL yapısı buna bağlı.
i18n:
  structure: multiple_folders
  locales: [tr, en]
  default_locale: tr

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: blog
    label: Blog
    label_singular: Yazı
    folder: src/content/blog
    create: true
    i18n: true
    identifier_field: baslik
    # DİKKAT: Bu slug canlı sitedeki URL'dir. Mevcut bir yazıyı taşırken
    # deltek.com.tr'deki slug'ın AYNISI girilmeli (bkz. CLAUDE.md).
    slug: "{{slug}}"
    summary: "{{baslik}}"
    sortable_fields: [tarih, baslik]
    fields:
      - { name: baslik, label: Başlık, widget: string, i18n: true }
      - { name: ozet,   label: Kısa özet (liste ve önizlemede görünür), widget: text, required: false, i18n: true }
      - { name: tarih,  label: Tarih, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, required: false, i18n: duplicate }
      - { name: kapak,  label: Kapak görseli, widget: image, required: false, i18n: duplicate }
      - { name: video,  label: "YouTube video linki (isteğe bağlı)", widget: string, required: false, i18n: duplicate }
      - name: galeri
        label: Foto galerisi
        widget: list
        required: false
        i18n: duplicate
        label_singular: Fotoğraf
        fields:
          - { name: foto, label: Fotoğraf, widget: image }
      - { name: body, label: Yazı içeriği, widget: markdown, required: false, i18n: true }
